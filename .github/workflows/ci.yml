name: CI

# Every push and pull request: the library and the client, the tests and their vectors, the
# proofs (with Mathlib's prebuilt cache), and the three audits: no unproved runtime code, no
# axiom beyond Lean's three, every module replayed through the kernel.

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No unproved runtime code
        run: scripts/check-runtime.sh
      - name: Build the library and leanlight
        run: lake build
      - name: Tests
        working-directory: tests
        run: |
          lake build
          ./.lake/build/bin/leanlight-store-test
          ./.lake/build/bin/leanlight-ssz-test
          ./.lake/build/bin/leanlight-bls-test --quick
          ./.lake/build/bin/leanlight-client-test
          ./.lake/build/bin/leanlight-bench --runs 3

  proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib's cache
        working-directory: proofs
        run: lake exe cache get
      - name: Build the proofs
        working-directory: proofs
        run: lake build
      - name: Axiom audit
        run: scripts/check-axioms.sh
      - name: Kernel replay
        working-directory: proofs
        env:
          LEANLIGHT_KERNEL_JOBS: "2"
        run: ../scripts/check-kernel.sh

  # The optional evm/ package, independent of the jobs above: the runtime rule on LeanLightEvm
  # and the vendored EthLib, the library and leanlight-evm, the recorded calls (--quick: no
  # sweeps).
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No unproved runtime code, EthLib as pinned
        run: evm/scripts/check-runtime.sh
      - name: Build leanlight-evm
        working-directory: evm
        run: lake build
      - name: Tests
        working-directory: evm
        run: |
          lake build leanlight-evm-test
          ./.lake/build/bin/leanlight-evm-test --quick

  # Its proofs: call_agrees and the composition with the light client, the axiom audit and the
  # kernel replay. They import leanLight's driver proofs, hence Mathlib's cache.
  evm-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Mathlib's cache
        working-directory: evm/proofs
        run: lake exe cache get
      - name: Build the proofs
        working-directory: evm/proofs
        run: lake build
      - name: Axiom audit
        run: evm/scripts/check-axioms.sh
      - name: Kernel replay
        env:
          LEANLIGHT_KERNEL_JOBS: "2"
        run: evm/scripts/check-kernel.sh
